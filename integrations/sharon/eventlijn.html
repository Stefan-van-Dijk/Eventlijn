<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Eventlijn in Sharon</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.55 system-ui, sans-serif; }
    body { box-sizing: border-box; margin: 0 auto; max-width: 36rem; padding: 2rem 1.25rem; }
    h1 { line-height: 1.15; }
    article { border: 1px solid currentColor; border-radius: 1rem; padding: 1rem; overflow-wrap: anywhere; }
    button, a { font: inherit; }
    button { margin-right: 0.75rem; min-height: 2.75rem; padding: 0.35rem 0.9rem; }
  </style>
  <script type="module" src="./eventlijn-handoff.js"></script>
</head>
<body>
  <main>
    <h1>Evenement bewaren in Sharon</h1>
    <p>Bewaar de titel, bezoekdag en locatie als privénotitie op dit apparaat.</p>
    <article id="event" aria-labelledby="title" hidden>
      <h2 id="title"></h2>
      <p id="details"></p>
      <button id="save" type="button">Bewaar in Notities en lijsten</button>
    </article>
    <p id="status" role="status"></p>
    <a href="./">Open Sharon</a>
    <noscript><p>Schakel JavaScript in om de notitie lokaal te bewaren.</p></noscript>
  </main>
</body>
</html>
