<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Openbaar evenement — Event Line</title>
  <link rel="stylesheet" href="eventlijn.css">
  <script src="openbaar.js" defer></script>
</head>
<body>
  <main class="shell">
    <a class="logo" href="./">Event <span>Line</span></a>
    <section class="panel" aria-labelledby="event-title">
      <h1 id="event-title">Openbaar evenement</h1>
      <p id="event-period" aria-live="polite">Evenement laden…</p>
      <p id="event-location" hidden></p>
      <p id="event-topic" hidden></p>
      <noscript><p>Schakel JavaScript in om het evenement te bekijken.</p></noscript>
    </section>
  </main>
</body>
</html>
